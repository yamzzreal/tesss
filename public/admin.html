<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Yamzz Payment</title><link rel="stylesheet" href="/assets/app.css"></head><body><main class="auth-wrap"><section class="card auth"><a class="logo" href="/">YAMZZ <span>PAYMENT</span></a><h1>Admin Console</h1><p class="sub">Panel internal untuk monitoring layanan merchant.</p><form id="f" class="form"><div class="field"><label>Email admin</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn pink">Masuk</button></form><button id="stats" class="btn ghost" style="width:100%;margin-top:10px">Muat statistik</button><pre id="out" class="api" style="white-space:pre-wrap"></pre></section></main><script>const f=document.getElementById('f'),out=document.getElementById('out');f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});out.textContent=JSON.stringify(await r.json(),null,2)};stats.onclick=async()=>{const r=await fetch('/api/admin-stats');out.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>

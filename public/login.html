<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Masuk — Yamzz Payment</title>

  <link rel="stylesheet" href="/assets/app.css">
</head>

<body>

  <main class="auth-wrap">

    <section class="card auth">

      <a class="logo" href="/">
        YAMZZ <span>PAYMENT</span>
      </a>

      <h1>Selamat datang kembali.</h1>

      <p class="sub">
        Masuk ke dashboard merchant untuk mengelola QRIS dan transaksi.
      </p>

      <form id="f" class="form">

        <div class="field">
          <label for="email">Email</label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="Masukkan email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Masukkan password"
            required
          >
        </div>

        <button
          id="loginBtn"
          type="submit"
          class="btn pink"
        >
          Masuk ke dashboard
        </button>

        <div id="out" class="form-out"></div>

      </form>

      <div class="auth-foot">
        Belum punya akun?
        <a href="/register.html">Daftar merchant</a>
      </div>

    </section>

  </main>


  <script>
    const f = document.getElementById('f');
    const out = document.getElementById('out');
    const loginBtn = document.getElementById('loginBtn');

    f.onsubmit = async (e) => {
      e.preventDefault();

      out.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Memproses...';

      try {

        const formData = new FormData(f);

        const email = String(
          formData.get('email') || ''
        ).trim().toLowerCase();

        const password = String(
          formData.get('password') || ''
        );

        if (!email || !password) {
          out.textContent = 'Email dan password wajib diisi.';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Masuk ke dashboard';
          return;
        }

        const r = await fetch('/api/login', {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            email,
            password
          })
        });

        const d = await r.json();

        console.log('LOGIN RESPONSE:', d);

        if (!r.ok || !d.success) {

          out.textContent =
            d.error || 'Email atau password salah.';

          loginBtn.disabled = false;
          loginBtn.textContent = 'Masuk ke dashboard';

          return;
        }

        /*
         * Login berhasil.
         *
         * API login harus mengembalikan:
         *
         * d.api_key
         * d.merchant
         */

        if (!d.api_key) {

          console.error(
            'API key tidak ditemukan dalam response login:',
            d
          );

          out.textContent =
            'Login berhasil, tetapi API key tidak diterima dari server.';

          loginBtn.disabled = false;
          loginBtn.textContent = 'Masuk ke dashboard';

          return;
        }


        /*
         * Simpan API key merchant
         */
        localStorage.setItem(
          'merchant_api_key',
          d.api_key
        );


        /*
         * Simpan informasi merchant
         */
        if (d.merchant) {

          localStorage.setItem(
            'merchant',
            JSON.stringify(d.merchant)
          );

        }


        /*
         * Debug untuk memastikan data benar-benar tersimpan
         */
        console.log(
          'Merchant API key tersimpan:',
          !!localStorage.getItem('merchant_api_key')
        );

        console.log(
          'Merchant:',
          d.merchant
        );


        out.textContent =
          'Login berhasil. Membuka dashboard...';


        /*
         * Masuk ke dashboard
         */
        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 300);

      } catch (error) {

        console.error(
          'LOGIN ERROR:',
          error
        );

        out.textContent =
          'Terjadi kesalahan koneksi. Silakan coba lagi.';

        loginBtn.disabled = false;
        loginBtn.textContent = 'Masuk ke dashboard';
      }
    };
  </script>

</body>
</html>
